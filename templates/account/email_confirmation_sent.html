{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20 text-center">
    <div class="bg-white rounded-3xl shadow-xl p-10">
        <h2 class="text-3xl font-bold mb-6 text-emerald-700">Check Your Email</h2>
        <p class="text-gray-600 mb-8">We've sent a verification link to <strong>{{ email }}</strong>.</p>
        <p class="text-sm text-gray-500">Please check your inbox (and spam folder).</p>
        
        <a href="{% url 'account_login' %}" 
           class="inline-block mt-8 bg-emerald-600 hover:bg-emerald-700 text-white px-10 py-4 rounded-2xl font-semibold">
            Back to Login
        </a>
    </div>
</div>
{% endblock %}
