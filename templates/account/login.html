{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white rounded-3xl shadow-xl p-10">
        <h2 class="text-3xl font-bold text-center mb-8">Login to EnerShift</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold mt-6">
                Login
            </button>
        </form>
        
        <div class="text-center mt-6 space-y-2">
            <a href="{% url 'account_signup' %}" class="text-emerald-600 hover:underline block">Create New Account</a>
            <a href="{% url 'account_reset_password' %}" class="text-emerald-600 hover:underline block">Forgot Password?</a>
        </div>
    </div>
</div>
{% endblock %}
