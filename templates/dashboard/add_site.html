{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-6 py-20">
    <div class="bg-white rounded-3xl shadow-xl p-10">
        <h2 class="text-3xl font-bold mb-8">Add New Site</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" 
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold mt-8">
                Add Site
            </button>
        </form>
        
        <a href="{% url 'dashboard_home' %}" class="block text-center mt-6 text-gray-500 hover:text-gray-700">
            ← Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
