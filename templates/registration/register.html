{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white rounded-3xl shadow p-10">
        <h2 class="text-3xl font-bold text-center mb-8">Create Account</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" 
                    class="w-full bg-[var(--primary)] hover:bg-emerald-600 text-white py-4 rounded-2xl font-semibold mt-6">
                Create Account
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            Already have an account? <a href="/dashboard/login/" class="text-[var(--primary)]">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
