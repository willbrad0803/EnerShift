{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white rounded-3xl shadow-xl p-10">
        <h2 class="text-3xl font-bold text-center mb-8">Reset Password</h2>
        <p class="text-gray-600 mb-8 text-center">Enter your email and we'll send you a link to reset your password.</p>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold mt-6">
                Send Reset Link
            </button>
        </form>
    </div>
</div>
{% endblock %}
