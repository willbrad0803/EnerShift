{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white rounded-3xl shadow-xl p-10">
        <h2 class="text-3xl font-bold text-center mb-10">Welcome to EnerShift</h2>

        <!-- Tab Toggle -->
        <div class="flex border-b mb-10">
            <button onclick="showLogin()" id="login-tab"
                    class="flex-1 py-4 font-medium border-b-2 border-emerald-600 text-emerald-600">
                Login
            </button>
            <button onclick="showRegister()" id="register-tab"
                    class="flex-1 py-4 font-medium text-gray-500">
                Create Account
            </button>
        </div>

        <!-- Login Form -->
        <div id="login-form">
            <form method="post">
                {% csrf_token %}
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" name="{{ form.username.name }}" 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 focus:ring-emerald-600 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" name="{{ form.password.name }}" 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 focus:ring-emerald-600 outline-none transition">
                    </div>
                    <button type="submit" 
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold transition">
                        Login
                    </button>
                </div>
            </form>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="hidden">
            <form method="post">
                {% csrf_token %}
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" name="{{ register_form.username.name }}" 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 focus:ring-emerald-600 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" name="{{ register_form.email.name }}" 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 focus:ring-emerald-600 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" name="{{ register_form.password1.name }}" 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 focus:ring-emerald-600 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                        <input type="password" name="{{ register_form.password2.name }}" 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 focus:ring-emerald-600 outline-none transition">
                    </div>
                    <button type="submit" 
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold transition">
                        Create Account
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-sm text-gray-500 mt-8">
            Need help? <a href="/contact.html" class="text-emerald-600 hover:underline">Contact us</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function showLogin() {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('login-tab').classList.add('border-b-2', 'border-emerald-600', 'text-emerald-600');
        document.getElementById('login-tab').classList.remove('text-gray-500');
        document.getElementById('register-tab').classList.remove('border-b-2', 'border-emerald-600', 'text-emerald-600');
        document.getElementById('register-tab').classList.add('text-gray-500');
    }

    function showRegister() {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
        document.getElementById('register-tab').classList.add('border-b-2', 'border-emerald-600', 'text-emerald-600');
        document.getElementById('register-tab').classList.remove('text-gray-500');
        document.getElementById('login-tab').classList.remove('border-b-2', 'border-emerald-600', 'text-emerald-600');
        document.getElementById('login-tab').classList.add('text-gray-500');
    }

    window.onload = showLogin;
</script>
{% endblock %}
