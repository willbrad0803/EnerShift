{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white rounded-3xl shadow-xl p-10">
        <h2 class="text-3xl font-bold text-center mb-10">Welcome to EnerShift</h2>

        <!-- Tab Toggle -->
        <div class="flex border-b mb-10">
            <button onclick="showLogin()" id="login-tab"
                    class="flex-1 py-4 font-medium border-b-2 border-emerald-600 text-emerald-600">
                Login
            </button>
            <button onclick="showRegister()" id="register-tab"
                    class="flex-1 py-4 font-medium text-gray-500">
                Create Account
            </button>
        </div>

        <!-- REGISTER FORM (Main focus) -->
        <div id="register-form">
            <form method="post" action="/dashboard/register/">
                {% csrf_token %}
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                        <input type="email" name="email" required 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" name="password1" required 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                        <input type="password" name="password2" required 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none transition">
                        {% if form.errors.password2 %}
                            <p class="text-red-600 text-sm mt-1">{{ form.errors.password2.0 }}</p>
                        {% endif %}
                    </div>
                    <button type="submit" 
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold text-lg transition">
                        Create Account
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-sm text-gray-500 mt-8">
            Need help? <a href="/contact.html" class="text-emerald-600 hover:underline">Contact us</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function showRegister() {
        // For now we only show register tab since login is secondary
        // You can expand later
    }
    window.onload = showRegister;
</script>
{% endblock %}
