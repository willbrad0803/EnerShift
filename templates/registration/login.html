{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white rounded-3xl shadow-xl p-10">
        <h2 class="text-3xl font-bold text-center mb-10">Welcome to EnerShift</h2>

        <!-- Tabs -->
        <div class="flex border-b mb-10">
            <button onclick="showLogin()" id="login-tab" 
                    class="flex-1 py-4 font-medium border-b-2 border-emerald-600 text-emerald-600">Login</button>
            <button onclick="showRegister()" id="register-tab" 
                    class="flex-1 py-4 font-medium text-gray-500">Create Account</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-form">
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="text" name="username" required 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" name="password" required 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <button type="submit" 
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold">
                        Login
                    </button>
                </div>
            </form>
            <p class="text-center text-sm text-gray-500 mt-4">
                <a href="{% url 'password_reset' %}" class="text-emerald-600 hover:underline">Forgot Password?</a>
            </p>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-form" class="hidden">
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                        <input type="email" name="email" required 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" name="password1" required 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                        <input type="password" name="password2" required 
                               class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <button type="submit" 
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold">
                        Create Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function showLogin() {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('login-tab').classList.add('border-b-2', 'border-emerald-600', 'text-emerald-600');
        document.getElementById('register-tab').classList.remove('border-b-2', 'border-emerald-600', 'text-emerald-600');
    }
    function showRegister() {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
        document.getElementById('login-tab').classList.remove('border-b-2', 'border-emerald-600', 'text-emerald-600');
        document.getElementById('register-tab').classList.add('border-b-2', 'border-emerald-600', 'text-emerald-600');
    }
    window.onload = showLogin;
</script>
{% endblock %}
