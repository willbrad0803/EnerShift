{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white rounded-3xl shadow p-10">
        <h2 class="text-3xl font-bold text-center mb-8">Welcome to EnerShift</h2>

        <!-- Toggle between Login and Register -->
        <div class="flex border-b mb-8">
            <button onclick="showLogin()" id="login-tab"
                    class="flex-1 py-3 font-medium border-b-2 border-[var(--primary)] text-[var(--primary)]">
                Login
            </button>
            <button onclick="showRegister()" id="register-tab"
                    class="flex-1 py-3 font-medium text-gray-500">
                Create Account
            </button>
        </div>

        <!-- Login Form -->
        <div id="login-form">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" 
                        class="w-full bg-[var(--primary)] hover:bg-emerald-600 text-white py-4 rounded-2xl font-semibold mt-6">
                    Login
                </button>
            </form>
        </div>

        <!-- Register Form (hidden by default) -->
        <div id="register-form" class="hidden">
            <form method="post">
                {% csrf_token %}
                {{ register_form.as_p }}
                <button type="submit" 
                        class="w-full bg-[var(--primary)] hover:bg-emerald-600 text-white py-4 rounded-2xl font-semibold mt-6">
                    Create Account
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-gray-500 mt-8">
            Need help? <a href="/contact.html" class="text-[var(--primary)]">Contact us</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function showLogin() {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('login-tab').classList.add('border-b-2', 'border-[var(--primary)]', 'text-[var(--primary)]');
        document.getElementById('login-tab').classList.remove('text-gray-500');
        document.getElementById('register-tab').classList.remove('border-b-2', 'border-[var(--primary)]', 'text-[var(--primary)]');
        document.getElementById('register-tab').classList.add('text-gray-500');
    }

    function showRegister() {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
        document.getElementById('register-tab').classList.add('border-b-2', 'border-[var(--primary)]', 'text-[var(--primary)]');
        document.getElementById('register-tab').classList.remove('text-gray-500');
        document.getElementById('login-tab').classList.remove('border-b-2', 'border-[var(--primary)]', 'text-[var(--primary)]');
        document.getElementById('login-tab').classList.add('text-gray-500');
    }
</script>
{% endblock %}
