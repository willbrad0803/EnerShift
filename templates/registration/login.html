{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white rounded-3xl shadow-xl p-10">
        <h2 class="text-3xl font-bold text-center mb-8">Welcome to EnerShift</h2>

        <div class="flex border-b mb-8">
            <button onclick="showLogin()" id="login-tab" 
                    class="flex-1 py-3 font-medium border-b-2 border-emerald-600 text-emerald-600">Login</button>
            <button onclick="showRegister()" id="register-tab" 
                    class="flex-1 py-3 font-medium text-gray-500">Create Account</button>
        </div>

        <!-- Login -->
        <div id="login-form">
            <form method="post">
                {% csrf_token %}
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                        <input type="text" name="username" class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" name="password" class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold">
                        Login
                    </button>
                </div>
            </form>
        </div>

        <!-- Register -->
        <div id="register-form" class="hidden">
            <form method="post">
                {% csrf_token %}
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                        <input type="text" name="username" class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" name="email" class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" name="password1" class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                        <input type="password" name="password2" class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:border-emerald-600 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold">
                        Create Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function showLogin() {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
    }
    function showRegister() {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
    }
    window.onload = showLogin;
</script>
{% endblock %}
