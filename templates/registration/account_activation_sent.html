{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20 text-center">
    <div class="bg-white rounded-3xl shadow-xl p-10">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full mx-auto flex items-center justify-center mb-6 text-4xl">
            📧
        </div>
        <h2 class="text-3xl font-bold mb-4">Check your inbox</h2>
        <p class="text-gray-600 mb-8">
            We've sent an activation link to <strong>{{ email }}</strong>.
        </p>
        <p class="text-sm text-gray-500">
            Please check your spam folder if you don't see it.<br>
            <a href="/dashboard/login/" class="text-emerald-600 hover:underline">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
