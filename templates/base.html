{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnerShift - Energy Flexibility OS</title>
    <meta name="description" content="Shift energy use to cheap wind power and earn from flexibility markets.">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    
    <!-- Leaflet for map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --primary: #10b981;
        }
        .cta-btn {
            background-color: var(--primary);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <!-- Navbar -->
    <nav class="bg-[#0f172a] text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-bold text-emerald-400">EnerShift</span>
            </div>
            
            <div class="hidden md:flex items-center gap-8 text-sm">
                <a href="/" class="hover:text-emerald-400 transition">Home</a>
                <a href="/about.html" class="hover:text-emerald-400 transition">About</a>
                <a href="/demo.html" class="hover:text-emerald-400 transition">Demo</a>
                <a href="/pricing.html" class="hover:text-emerald-400 transition">Pricing</a>
                <a href="/contact.html" class="hover:text-emerald-400 transition">Contact</a>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="{% url 'account_login' %}" class="text-sm hover:text-emerald-400 transition">Login</a>
                <a href="{% url 'account_signup' %}" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-2.5 rounded-2xl text-sm font-semibold transition">Get Started</a>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <!-- Footer -->
    <footer class="bg-[#0f172a] text-white py-12 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center text-sm opacity-70">
            © 2026 EnerShift. Helping North West businesses shift load and earn from flexibility markets.
        </div>
    </footer>

    {% block extra_scripts %}
    {% endblock %}
</body>
</html>
